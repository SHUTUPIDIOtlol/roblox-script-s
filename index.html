<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bedroom Horror</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:Arial}
canvas{display:block}

/* UI buttons */
#lightBtn,#eyesBtn,#knockBtn,#windowBtn{
 position:absolute;
 padding:16px 22px;
 background:rgba(0,0,0,.7);
 color:#fff;border:1px solid #555;border-radius:12px;font-size:18px;
 pointer-events:auto;
}
#lightBtn{top:20px;right:20px}
#knockBtn{top:90px;right:20px}
#eyesBtn{bottom:60px;right:20px}
#windowBtn{top:160px;left:20px} /* window button on left */

/* Dialogue text */
#text{
 position:absolute;bottom:18%;width:100%;text-align:center;color:#fff;font-size:18px;opacity:1;transition:.25s;text-shadow:2px 2px 4px #000;
}

/* Eyelids */
#eyelidTop,#eyelidBottom{
 position:fixed;left:0;width:100%;height:50%;
 background:#000;pointer-events:none;
 transition:transform 0.6s cubic-bezier(.4,0,.2,1)
}
#eyelidTop{top:0;transform:translateY(-100%)}
#eyelidBottom{bottom:0;transform:translateY(100%)}
.closed #eyelidTop{transform:translateY(0)}
.closed #eyelidBottom{transform:translateY(0)}

/* Death screen */
#death{
 position:fixed;inset:0;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px;opacity:0;pointer-events:none;transition:.5s
}
#death.show{opacity:1}

/* JP monster */
#jpMonster{
 position:absolute;width:200px;height:auto;top:75%;left:50%;transform:translate(-50%,-50%);display:none;pointer-events:none;z-index:5;
}

/* Red screen */
#redScreen{
 position:fixed;inset:0;background:rgba(255,0,0,0);pointer-events:none;z-index:3;transition:.2s;
}

/* Glitch text */
.randomText{
 position:absolute;color:red;font-size:28px;font-weight:bold;text-shadow:2px 2px 4px black;pointer-events:none;z-index:8;
}

/* Anger bar */
#angerContainer{
 position:fixed;bottom:120px;right:20px;width:200px;height:20px;border:2px solid #fff;border-radius:6px;background:#111;z-index:10;
}
#angerBar{
 height:100%;width:0%;background:#f00;border-radius:4px;transition:width 0.2s ease;
}

/* Instructions modal */
#instructions{
 position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:20;
 pointer-events:auto;
}
#instructionsContent{
 background:#111;color:#fff;padding:20px;border-radius:12px;text-align:center;max-width:500px;position:relative;
}
#instructionsContent button{
 position:absolute;top:10px;right:10px;padding:6px 12px;background:red;color:#fff;border:none;border-radius:6px;font-size:16px;cursor:pointer;
}
#cheatInput{
 margin-top:12px;padding:6px;border-radius:6px;border:none;width:80%;font-size:16px;
}
</style>
</head>
<body>

<div id="ui">
 <div id="lightBtn">Light</div>
 <div id="knockBtn">Knock</div>
 <div id="eyesBtn">Close Eyes</div>
 <div id="windowBtn">Window</div>
 <div id="text"></div>
</div>

<div id="eyelidTop"></div>
<div id="eyelidBottom"></div>
<div id="death">You died.</div>
<div id="redScreen"></div>
<img src="jp.png" id="jpMonster">
<div id="angerContainer"><div id="angerBar"></div></div>

<!-- Instructions Modal -->
<div id="instructions">
 <div id="instructionsContent">
  <button id="closeInstructions">X</button>
  <h2>INSTRUCTIONS</h2>
  <p>You are in a room. Knock while the entity is knocking, otherwise it'll fill the anger bar.<br>
  You have 0.7 seconds to react.<br>
  Close your eyes when you see it.<br>
  Check the window to reduce the chance of the girl appearing.</p>
  <label>Cheatcode:</label><br>
  <input type="text" id="cheatInput" placeholder="Type code here...">
 </div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// ---------- AUDIO ----------
const doorKnockSnd = new Audio("knockknock.mp3");
const talk = new Audio("talk.mp3");
const scare = new Audio("scare.mp3");

// ---------- STATE ----------
let dead=false, eyesClosed=false, lightOn=true, gamePaused=true;
let doorMonsterActive=false, jpMonsterActive=false;
let talkCooldown=false, glitchInterval=false;
let doorDanger=0, angerFillCount=0;
const maxDanger=3;
let jpPersistent=false;
let windowCooldown=false;
let scarePitch=1;
let cheatImmune=false;
let angerInterval;

// UI
const textEl=document.getElementById("text");
const jpMonster=document.getElementById("jpMonster");
const redScreen=document.getElementById("redScreen");
const knockBtn=document.getElementById("knockBtn");
const eyesBtn=document.getElementById("eyesBtn");
const lightBtn=document.getElementById("lightBtn");
const windowBtn=document.getElementById("windowBtn");
const angerBar=document.getElementById("angerBar");
const instructions=document.getElementById("instructions");
const closeInstructions=document.getElementById("closeInstructions");
const cheatInput=document.getElementById("cheatInput");

// ---------- ROOM ----------
let scene=new THREE.Scene();
let cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,50);
let renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
document.body.appendChild(renderer.domElement);
cam.position.set(0,1.6,2);

let ambient=new THREE.AmbientLight(0x666666);
scene.add(ambient);
let lamp=new THREE.PointLight(0xfff0cc,2.5,10);
lamp.position.set(0,2.4,0);
scene.add(lamp);

function box(w,h,d,x,y,z,c){
 let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:c}));
 m.position.set(x,y,z);
 scene.add(m);
}

const R=6;
box(R,3,0.1,0,1.5,-R/2,0x2a2a2a);
box(R,3,0.1,0,1.5,R/2,0x2a2a2a);
box(0.1,3,R,-R/2,1.5,0,0x2a2a2a);
box(0.1,3,R,R/2,1.5,0,0x2a2a2a);
box(R,0.1,R,0,0,0,0x1a1a1a);
box(R,0.1,R,0,3,0,0x1a1a1a);

// ---------- UTILITIES ----------
function showText(txt){ if(dead) return; textEl.textContent=txt; textEl.style.opacity=1; setTimeout(()=>textEl.style.opacity=0,4000);}
function spawnGlitchText(){ if(dead) return; let words=["CLOSE YOUR EYES.","EYES","CLOSE","SA@NI!$TY"]; let t=document.createElement("div"); t.className="randomText"; t.textContent=words[Math.floor(Math.random()*words.length)]; t.style.top=Math.random()*100+"%"; t.style.left=Math.random()*100+"%"; t.style.transform=`rotate(${(Math.random()*60-30)}deg)`; document.body.appendChild(t); setTimeout(()=>t.remove(),2000);}
function updateAngerBar(){angerBar.style.width=((doorDanger/maxDanger)*100)+"%";}

// ---------- ANGER BAR AUTO INCREASE ----------
function startAngerBar(){
 angerInterval=setInterval(()=>{
   if(dead||gamePaused) return;
   doorDanger +=0.3;
   if(doorDanger>=maxDanger){
     doorDanger=maxDanger;
     angerFillCount++; 
     if(angerFillCount>=2){ jpPersistent=true; showText("ANGER BAR FULL"); disableHUD(); }
     triggerJPMonster();
   }
   updateAngerBar();
 },1000);
}

// ---------- DOOR MONSTER ----------
let knockTimeout;
function triggerDoorMonsterKnock(){
 if(dead||eyesClosed||doorMonsterActive||gamePaused) return;
 doorMonsterActive=true;
 let delay=200+Math.random()*500; // quick for testing reaction
 knockTimeout=setTimeout(()=>{
   if(dead||eyesClosed) return;
   doorKnockSnd.currentTime=0; doorKnockSnd.play();
   showText("the bitch is knocking");
   if(!talkCooldown){ talk.currentTime=0; talk.play(); talkCooldown=true; setTimeout(()=>talkCooldown=false,13000);}
 },delay);
}

// KNOCK BUTTON
knockBtn.onclick=()=>{
 if(dead||gamePaused) return;
 if(doorMonsterActive && !cheatImmune){
   doorMonsterActive=false; 
   clearTimeout(knockTimeout);
   doorDanger=0; // only reset if knock sound is playing
   updateAngerBar();
   showText("You aurafarmed the entity to scaredment");
 } else showText("No one is knocking.");
};

// ---------- JP MONSTER ----------
function triggerJPMonster(){
 if(dead||gamePaused||jpMonsterActive) return;
 jpMonsterActive=true;
 jpMonster.style.display="block";
 redScreen.style.background="rgba(255,0,0,0.25)";
 const s=scare.cloneNode(); s.currentTime=0; s.playbackRate=scarePitch; s.play(); scarePitch*=0.9;
 glitchInterval=setInterval(spawnGlitchText,1000);
 setTimeout(()=>{ if(!eyesClosed&&!dead&&!jpPersistent&&!cheatImmune) die(); },3000);
}

// ---------- WINDOW BUTTON ----------
windowBtn.onclick=()=>{
 if(dead||gamePaused) return;
 showText("You checked the window, the entity stays away longer.");
 windowCooldown=true;
 setTimeout(()=>{ windowCooldown=false; showText("I should check the window again."); },15000);
}

// ---------- EYES BUTTON ----------
eyesBtn.onclick=()=>{
 eyesClosed=!eyesClosed;
 document.body.classList.toggle("closed",eyesClosed);
 if(eyesClosed){
   doorMonsterActive=false; clearTimeout(knockTimeout);
   if(!jpPersistent){ jpMonsterActive=false; jpMonster.style.display="none"; redScreen.style.background="rgba(255,0,0,0)"; }
   clearInterval(glitchInterval);
   showText("Eyes closed...");
 }
};

// LIGHT BUTTON
lightBtn.onclick=()=>{ lightOn=!lightOn; lamp.intensity=lightOn?2.5:0; ambient.intensity=lightOn?0.7:0.15; }

// DEATH
function die(){
 if(cheatImmune) return;
 dead=true;
 jpMonster.style.display="none";
 redScreen.style.background="rgba(255,0,0,0)";
 knockBtn.disabled=true; eyesBtn.disabled=true; lightBtn.disabled=true; windowBtn.disabled=true;
 clearInterval(glitchInterval); clearInterval(angerInterval);
 showText(""); document.getElementById("death").classList.add("show"); 
 scare.currentTime=0; scare.play();
}

// DISABLE HUD FOR ANGER FULL
function disableHUD(){
 knockBtn.disabled=true; eyesBtn.disabled=true; lightBtn.disabled=true; windowBtn.disabled=true;
 showText("ANGER BAR FULL");
}

// ---------- CAMERA ----------
let look={x:0,y:0},lastX=0,lastY=0,movingMouse=false;
renderer.domElement.onmousedown=e=>{movingMouse=true; lastX=e.clientX; lastY=e.clientY;}
document.onmousemove=e=>{if(!movingMouse)return; look.y-=(e.clientX-lastX)*0.002; look.x-=(e.clientY-lastY)*0.002; look.x=Math.max(-1.5,Math.min(1.5,look.x)); lastX=e.clientX; lastY=e.clientY;}
document.onmouseup=()=>movingMouse=false;
let keys={};
onkeydown=e=>keys[e.code]=1; onkeyup=e=>keys[e.code]=0;
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function loop(){
 if(!dead&&!eyesClosed&&!gamePaused){
   let speed=0.045;
   let dx=(keys.KeyD?1:0)-(keys.KeyA?1:0);
   let dz=(keys.KeyS?1:0)-(keys.KeyW?1:0);
   let move=new THREE.Vector3(dx,0,dz);
   move.applyAxisAngle(new THREE.Vector3(0,1,0),look.y);
   cam.position.add(move.multiplyScalar(speed));
   cam.position.x=clamp(cam.position.x,-2.7,2.7);
   cam.position.z=clamp(cam.position.z,-2.7,2.7);
 }
 cam.rotation.order="YXZ"; cam.rotation.y=look.y; cam.rotation.x=look.x;
 renderer.render(scene,cam);
 requestAnimationFrame(loop);
}
loop();
onresize=()=>{cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);}

// ---------- SPAWNS ----------
setInterval(()=>{ if(!doorMonsterActive && !dead && !gamePaused) triggerDoorMonsterKnock(); },5000+Math.random()*5000);
setInterval(()=>{ if(!jpMonsterActive && !dead && !gamePaused) triggerJPMonster(); },25000+Math.random()*10000);

// ---------- INSTRUCTIONS ----------
closeInstructions.onclick=()=>{ instructions.style.display="none"; gamePaused=false; startAngerBar(); }

// CHEATCODE
cheatInput.oninput=()=>{ 
 if(cheatInput.value==="101"){ cheatImmune=true; showText("Cheat active: Immune!"); }
 if(cheatInput.value==="102"){ knockBtn.onclick=()=>{ showText("Knocking x3!"); } }
 }

window.onload=()=>{ instructions.style.display="flex"; }
</script>
</body>
  </html>
